# Base44 development environment for Voland.
# Two services: a one-shot Emscripten WASM-core build, then the Vite dev server.
# The web service waits for the WASM build to finish before starting.

services:
  # One-shot: compiles the C11 core to WASM (Emscripten ≥6.0.9) and copies
  # the output to platform/web/public/core/ so Vite serves it as a static asset.
  wasm-build:
    image: emscripten/emsdk:latest
    working_dir: /app
    volumes:
      - .:/app
    command:
      - sh
      - -ec
      - >-
        pip3 install --break-system-packages ninja
        && rm -rf build/web
        && cmake --preset web
        && cmake --build --preset web
        && mkdir -p platform/web/public/core
        && cp build/web/core/switch_core.js build/web/core/switch_core.wasm platform/web/public/core/
        && echo 'WASM core build complete'
    restart: "no"

  # Vite dev server (Solid.js frontend). Bind-mounted source → live reload.
  web:
    image: node:22
    working_dir: /app/platform/web
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      wasm-build:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - >-
        npm install -g pnpm@10
        && pnpm install --frozen-lockfile
        && exec pnpm exec vite --host 0.0.0.0
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
